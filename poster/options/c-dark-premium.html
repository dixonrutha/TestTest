<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Poster C</title>
<link rel="stylesheet" href="common.css">
<style>
  .poster { background: #08131d; color: #fff; }
  .glow { position: absolute; width: 900px; height: 900px; left: 50%; top: -260px; transform: translateX(-50%); background: radial-gradient(circle, rgba(56,189,214,.35) 0%, rgba(56,189,214,0) 62%); }
  .laptop { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); width: 720px; }
  .lid { height: 430px; background: #1a2733; border-radius: 22px 22px 0 0; padding: 18px; box-shadow: 0 40px 90px rgba(0,0,0,.5); }
  .lid .scr { height: 100%; border-radius: 10px; background: #fff; overflow: hidden; }
  .base { height: 22px; background: linear-gradient(#cfd8df, #9aa8b3); border-radius: 0 0 22px 22px; margin: 0 -40px; }
  .ws-nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 26px; }
  .ws-nav b { width: 110px; height: 14px; border-radius: 7px; background: #0e2f45; display: block; }
  .ws-nav span { display: flex; gap: 14px; } .ws-nav span i { width: 46px; height: 9px; border-radius: 5px; background: #d5dee5; display: block; }
  .ws-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 8px 26px; align-items: center; }
  .ws-hero .tx div { height: 18px; border-radius: 9px; background: #0e2f45; margin-bottom: 10px; }
  .ws-hero .tx div:nth-child(2) { width: 80%; } .ws-hero .tx p { height: 9px; border-radius: 5px; background: #d5dee5; margin: 8px 0; width: 90%; }
  .ws-hero .tx .b { width: 120px; height: 34px; border-radius: 17px; background: #38bdd6; margin-top: 16px; }
  .ws-hero .im { height: 180px; border-radius: 16px; background: linear-gradient(140deg, #0e2f45, #38bdd6); }
  .ws-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 18px 26px; }
  .ws-cards span { height: 70px; border-radius: 12px; background: #eef3f6; display: block; }
  .pay-pill { right: 120px; top: 440px; }
  .body { position: absolute; left: 80px; right: 80px; top: 640px; text-align: center; }
  h1 { font-weight: 800; font-size: 84px; line-height: 1.02; letter-spacing: -2.8px; }
  h1 em { font-style: normal; color: #5fd3e8; }
  .sub { font-size: 25px; line-height: 1.45; color: #9fb3c2; margin: 26px auto 0; width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 44px; }
  .grid span { border: 1.5px solid rgba(95,211,232,.35); border-radius: 16px; padding: 18px 10px; font-size: 22px; font-weight: 600; background: rgba(255,255,255,.03); }
  .cta { position: absolute; left: 80px; right: 80px; bottom: 72px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .cta small { font-size: 22px; color: #9fb3c2; }
  .cta b { font-size: 54px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(100deg, #ffffff, #5fd3e8); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head>
<body><div class="poster">
  <div class="glow"></div>
  <div class="laptop">
    <div class="lid"><div class="scr">
      <div class="ws-nav"><b></b><span><i></i><i></i><i></i></span></div>
      <div class="ws-hero"><div class="tx"><div></div><div></div><p></p><p></p><div class="b"></div></div><div class="im"></div></div>
      <div class="ws-cards"><span></span><span></span><span></span></div>
    </div></div>
    <div class="base"></div>
  </div>
  <div class="pay-pill"><span class="ok"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div><b>Payment received</b><small>Mobile money</small></div></div>
  <div class="body">
    <h1 class="disp">Your business deserves<br>a <em>great website.</em></h1>
    <p class="sub">Professional websites, apps and business systems that work on any phone and accept mobile money.</p>
    <div class="grid"><span>Websites</span><span>Business systems</span><span>Mobile apps</span><span>Mobile money</span><span>WhatsApp bots</span><span>SMS alerts</span></div>
  </div>
  <div class="cta"><small>Call or WhatsApp</small><b class="disp">+255 672 944 649</b></div>
</div></body></html>
