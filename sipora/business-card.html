<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sipora PureTouch – Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 3.5in x 2in at 300dpi = 1050 x 600 px */
  :root {
    --green: #8DC73F;
    --green-mid: #7CAD30;
    --green-deep: #2F5A16;
    --ink: #2B2F2A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: #e9ece6; padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: center; }
  .card { width: 1050px; height: 600px; position: relative; overflow: hidden; border-radius: 0; box-shadow: 0 20px 50px rgba(0,0,0,.18); }

  /* ---------- FRONT ---------- */
  .front { background: #fff; }
  .front .arc { position: absolute; border-radius: 50%; }
  .front .arc.a1 { width: 520px; height: 520px; right: -230px; top: -260px; background: var(--green); opacity: .95; }
  .front .arc.a2 { width: 420px; height: 420px; right: -250px; top: -150px; border: 26px solid var(--green-mid); opacity: .35; }
  .front .arc.a3 { width: 380px; height: 380px; left: -210px; bottom: -230px; background: var(--green-mid); opacity: .9; }
  .front .arc.a4 { width: 300px; height: 300px; left: -150px; bottom: -200px; border: 18px solid #fff; opacity: .5; }
  .front .logo { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); height: 400px; }
  .front .tag { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 19px; letter-spacing: 7px; font-weight: 500; color: var(--green-mid); }
  .front .tag span { color: var(--ink); }

  /* ---------- BACK ---------- */
  .back { background: radial-gradient(circle at 15% 10%, #92CB45 0%, #6FA32B 40%, #3E6E1C 100%); color: #fff; }
  .back .watermark { position: absolute; right: -120px; bottom: -120px; width: 520px; opacity: .12; }
  .back .bubble { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); }
  .back .brand { position: absolute; left: 70px; top: 62px; display: flex; align-items: center; gap: 26px; }
  .back .brand .icon { width: 118px; height: 118px; background: #fff; border-radius: 50%; padding: 12px; box-shadow: 0 8px 22px rgba(0,0,0,.18); }
  .back .brand .icon img { width: 100%; }
  .back .brand .wm { height: 82px; }
  .back .tagline { position: absolute; left: 70px; top: 205px; font-size: 22px; font-weight: 300; letter-spacing: 1px; }
  .back .tagline b { font-weight: 600; }
  .back .rule { position: absolute; left: 70px; top: 252px; width: 120px; height: 5px; border-radius: 3px; background: #fff; }
  .back ul { position: absolute; left: 70px; top: 290px; list-style: none; display: grid; gap: 20px; }
  .back li { display: flex; align-items: center; gap: 20px; font-size: 27px; font-weight: 500; }
  .back li small { display: block; font-size: 16px; font-weight: 400; opacity: .85; letter-spacing: .5px; line-height: 1.1; }
  .back li .ic { width: 56px; height: 56px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .back li .ic svg { width: 28px; height: 28px; stroke: var(--green-deep); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .back .phone { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
  .back .sw { position: absolute; right: 60px; top: 70px; text-align: right; font-size: 18px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; opacity: .95; }
  .back .sw em { display: block; font-style: normal; font-size: 30px; letter-spacing: 1px; text-transform: none; font-weight: 700; }
</style>
</head>
<body>

<!-- FRONT -->
<div class="card front" id="front">
  <div class="arc a1"></div><div class="arc a2"></div>
  <div class="arc a3"></div><div class="arc a4"></div>
  <img class="logo" src="assets/logo-full.png" alt="Sipora PureTouch">
  <div class="tag">PROFESSIONAL <span>CLEANING</span> SERVICES</div>
</div>

<!-- BACK -->
<div class="card back" id="back">
  <img class="watermark" src="assets/logo-icon-white.png" alt="">
  <div class="bubble" style="width:70px;height:70px;right:330px;top:40px"></div>
  <div class="bubble" style="width:34px;height:34px;right:290px;top:120px"></div>
  <div class="bubble" style="width:22px;height:22px;right:400px;top:150px"></div>

  <div class="brand">
    <div class="icon"><img src="assets/logo-icon.png" alt=""></div>
    <img class="wm" src="assets/logo-wordmark-white.png" alt="Sipora PureTouch">
  </div>
  <div class="tagline">Professional cleaning for <b>Offices · Homes · Every Place</b></div>
  <div class="rule"></div>

  <ul>
    <li>
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
      <div><small>Call / WhatsApp</small><span class="phone">+255 718 846 550</span></div>
    </li>
    <li>
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <div><small>Location</small>Dodoma, Tanzania</div>
    </li>
  </ul>

  <div class="sw">Usafi ni Afya<em>Cleanliness is Health</em></div>
</div>

</body>
</html>
