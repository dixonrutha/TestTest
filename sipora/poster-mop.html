<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sipora PureTouch – Mop Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* 1080 x 1350 (4:5) */
  :root { --lime: #8DC73F; --lime-hi: #A4E03A; --green: #6FAE26; --deep: #1A4209; --night: #0C2604; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: #111; }
  .poster { width: 1080px; height: 1350px; position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 80% 85%, #1F5410 0%, transparent 45%), linear-gradient(160deg, #164008 0%, var(--deep) 40%, var(--night) 100%); }
  .scene { position: absolute; inset: 0; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* logo */
  .brand { position: absolute; right: 64px; top: 56px; display: flex; align-items: center; gap: 14px; z-index: 5; }
  .brand .icon { width: 84px; height: 84px; border-radius: 50%; background: #fff; padding: 7px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .brand .icon img { width: 100%; display: block; }
  .brand .wm { height: 56px; }

  /* headline (rotated like the reference) */
  .hl { position: absolute; left: 66px; top: 490px; transform: rotate(-30deg); transform-origin: left top; color: var(--deep); z-index: 3; white-space: nowrap; }
  .hl .l1 { font-size: 158px; font-weight: 900; line-height: .9; letter-spacing: -6px; }
  .hl .l2 { font-size: 86px; font-weight: 900; line-height: 1; letter-spacing: -2px; margin-top: 4px; }
  .hl .l2 i { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; letter-spacing: 0; color: var(--green); font-size: 92px; margin-left: 10px; }
  .hl .l3 { font-size: 72px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; margin-top: 6px; }

  /* contact */
  .contact { position: absolute; left: 64px; bottom: 70px; z-index: 5; }
  .contact .lbl { font-size: 30px; font-weight: 500; }
  .contact .ph { display: flex; align-items: center; gap: 14px; font-size: 52px; font-weight: 800; letter-spacing: .5px; margin-top: 4px; }
  .contact .ph span { width: 58px; height: 58px; border-radius: 50%; background: var(--lime-hi); color: var(--deep); display: grid; place-items: center; font-size: 30px; flex: none; }
  .contact .meta { display: flex; gap: 26px; margin-top: 16px; font-size: 20px; font-weight: 500; color: rgba(255,255,255,.9); }
  .contact .meta div { display: flex; align-items: center; gap: 8px; }
  .contact .meta svg { color: var(--lime-hi); font-size: 22px; }

  /* book now */
  .book { position: absolute; left: 832px; top: 970px; width: 200px; height: 200px; border-radius: 50%; background: #fff; z-index: 6;
    display: grid; place-items: center; text-align: center; color: var(--deep); font-size: 40px; font-weight: 900; line-height: 1.05; transform: rotate(-18deg);
    box-shadow: 0 0 0 10px rgba(164,224,58,.35), 0 20px 40px rgba(0,0,0,.4); }
  .book small { display: block; font-size: 15px; font-weight: 600; letter-spacing: 3px; color: var(--green); margin-top: 4px; }
</style>
</head>
