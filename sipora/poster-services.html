<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sipora PureTouch – Services Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* 1080 x 1350 (4:5) */
  :root { --lime: #8DC73F; --lime-hi: #A4E03A; --green: #6FAE26; --deep: #1F4A0C; --night: #12300A; --ink: #15200F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: #ccc; }
  .poster { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #E6DCC8; color: var(--ink); }
  .scene { position: absolute; inset: 0; width: 1080px; height: 1350px; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* header */
  .brand { position: absolute; left: 70px; top: 52px; display: flex; align-items: center; gap: 14px; }
  .brand .icon { height: 104px; }
  .brand .wm { height: 66px; }
  .loc { position: absolute; right: 70px; top: 76px; display: inline-flex; align-items: center; gap: 8px; background: var(--deep); color: #fff; font-weight: 600; font-size: 19px; letter-spacing: 2px; padding: 11px 22px; border-radius: 30px; box-shadow: 0 8px 20px rgba(31,74,12,.25); }
  .loc svg { color: var(--lime-hi); font-size: 22px; }

  /* title blocks */
  .t1 { position: absolute; left: 300px; top: 205px; background: linear-gradient(100deg, var(--night), var(--deep)); color: #fff; font-size: 66px; font-weight: 900; letter-spacing: 2px; padding: 4px 34px 6px; transform: rotate(-2deg); box-shadow: 0 14px 30px rgba(18,48,10,.3); }
  .t2 { position: absolute; left: 262px; top: 300px; background: #fff; color: var(--green); font-size: 104px; font-weight: 900; letter-spacing: 3px; line-height: 1.12; padding: 0 44px; box-shadow: 0 16px 40px rgba(0,0,0,.12); }
  .t2 span { background: linear-gradient(180deg, var(--lime-hi), var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t3 { position: absolute; left: 252px; top: 446px; background: linear-gradient(100deg, var(--lime), var(--lime-hi)); color: var(--night); font-size: 24px; font-weight: 600; padding: 12px 36px; transform: rotate(-3deg); box-shadow: 0 10px 24px rgba(111,174,38,.35); }

  /* service pills */
  .list { position: absolute; left: 70px; top: 548px; width: 520px; }
  .list::before { content: ""; position: absolute; left: 33px; top: 30px; bottom: 30px; border-left: 3px dotted rgba(31,74,12,.5); }
  .item { position: relative; height: 56px; margin-bottom: 10px; }
  .item .pill { position: absolute; left: 30px; right: 0; top: 0; height: 56px; border-radius: 0 30px 30px 0; background: #fff; box-shadow: 0 8px 22px rgba(60,50,20,.14);
    display: flex; align-items: center; justify-content: flex-end; padding: 0 28px; font-size: 23px; font-weight: 800; white-space: nowrap; }
  .item .pill em { font-style: normal; color: var(--green); margin-left: 7px; }
  .item .ic { position: absolute; left: 0; top: -5px; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 30px; z-index: 1;
    background: linear-gradient(140deg, #2E6A12, var(--night)); box-shadow: 0 0 0 5px #fff, 0 8px 18px rgba(0,0,0,.2); }
  .item:nth-child(even) .ic { background: linear-gradient(140deg, var(--lime-hi), var(--green)); color: var(--night); }

  /* bottom */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; background: linear-gradient(95deg, var(--night) 0%, var(--deep) 40%, var(--green) 85%, var(--lime-hi) 100%); border-top-right-radius: 120px 112px; }
  .qr { position: absolute; left: 70px; bottom: 34px; width: 206px; height: 206px; padding: 16px; border-radius: 24px; background: #fff; box-shadow: 0 0 0 8px rgba(141,199,63,.35), 0 16px 40px rgba(0,0,0,.25); z-index: 2; }
  .qr img { width: 100%; height: 100%; display: block; }
  .qr .badge { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: #fff; padding: 4px; }
  .qr .badge img { width: 100%; height: 100%; }
  .scan { position: absolute; left: 70px; bottom: 252px; width: 206px; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: var(--deep); }
  .contacts { position: absolute; left: 310px; right: 40px; bottom: 30px; display: flex; align-items: center; gap: 34px; color: #fff; }
  .contacts div { display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 600; }
  .contacts .c { width: 50px; height: 50px; border-radius: 50%; background: #fff; color: var(--deep); display: grid; place-items: center; font-size: 25px; flex: none; }
  .contacts small { display: block; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: .8; font-weight: 600; line-height: 1.1; }
  .contacts b { font-weight: 700; line-height: 1.1; }
</style>
</head>
